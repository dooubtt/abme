<!DOCTYPE html>
<html lang="ru">
  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8">
    <meta name="viewport">
    <title>Регистрация</title>
  </head>
  <body style="background-color: rgb(14, 14, 14);">
    <header>
    </header>
    <main>
      <div class="tab">
      <form action="pust.html" class="registr" method="post">
        <h1 style="text-align: center;">Регистрация</h1>
        <label for="name">Имя <small>без цифр</small></label>
        <input type="text" pattern="[A-Za-zА-Яа-яЁё]+" id="name" maxlength="30" placeholder="Как вас зовут?" required>
        <label for="email">Email <small>с @</small></label>
        <input type="email" id="email" placeholder="Ваш email" required>
        <label for="password">Пароль <small>от 8 символов</small></label>
        <input type="password" id="password" placeholder="1-9,A-Z,a-z,!@#$%^&*()" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
        <label for="age">Возраст</label>
        <select id="age">
          <option>18-25</option>
          <option>25+</option>
        </select>
        <label for="description">О себе:</label>
        <textarea id="description" minlength="50" maxlength="300" required placeholder="от 50 до 300 символов"></textarea>
        <button class="regs" type="submit">Зарегистрироваться</button>
      </form>
      <form action="pust.html" class="log" method="post">
        <h1 style="text-align: center;">Вход</h1>
          <label for="email2">Email</label>
          <input type="email" id="email2" placeholder="Ваш email" required>
          <label for="password2">Пароль</label>
          <input type="password" id="password2" placeholder="Ваш пароль" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
          <button class="regs" type="submit">Войти</button>
      </form>
    </div>
    </main>
    <footer></footer>
  </body>
</html>
